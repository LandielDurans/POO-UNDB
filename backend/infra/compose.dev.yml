
services:
  postgres:
    image: postgis/postgis:17-3.5
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME:-fuelfinder}
      POSTGRES_USER: ${DB_USER:-fuelfinder}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      TZ: UTC

    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"

    volumes:
      - fuelfinder_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 12

    networks:
      - fuelfinder_backend

  # Captura os e-mails enviados em dev; nada sai da maquina.
  # Caixa de entrada: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27.10
    restart: unless-stopped

    ports:
      - "127.0.0.1:${MAIL_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

    networks:
      - fuelfinder_backend

volumes:
  fuelfinder_postgres_data:

networks:
  fuelfinder_backend:
