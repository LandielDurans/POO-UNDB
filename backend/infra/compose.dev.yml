services:
  postgres:
    image: postgis/postgis:17-3.5
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME:-fuelfinder}
      POSTGRES_USER: ${DB_USER:-fuelfinder}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      TZ: UTC

    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"

    volumes:
      - fuelfinder_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 12

    networks:
      - fuelfinder_backend

  # Captura os e-mails enviados em desenvolvimento
  mailpit:
    image: axllent/mailpit:v1.27.10
    restart: unless-stopped

    ports:
      - "127.0.0.1:${MAIL_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

    networks:
      - fuelfinder_backend

  # API Spring Boot do FuelFinder
  backend:
    build:
      context: ..
      dockerfile: Dockerfile

    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:8080"

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-fuelfinder}
      DB_USER: ${DB_USER:-fuelfinder}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}

      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_SMTP_AUTH: "false"
      MAIL_SMTP_STARTTLS: "false"

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      VERIFICATION_LINK_BASE_URL: ${VERIFICATION_LINK_BASE_URL:-http://localhost:3000/verificar-email}

    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

    networks:
      - fuelfinder_backend

volumes:
  fuelfinder_postgres_data:

networks:
  fuelfinder_backend: