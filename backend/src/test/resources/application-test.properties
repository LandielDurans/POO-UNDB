spring.application.name=fuelfinder-test

spring.datasource.url=jdbc:h2:mem:fuelfinder_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Worker da outbox desligado: os testes acionam o processamento
app.identity.outbox.enabled=false
