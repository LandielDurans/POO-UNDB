spring.application.name=fuelfinder

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fuelfinder}
spring.datasource.username=${DB_USER:fuelfinder}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

# OpenAPI / Swagger - habilitado em desenvolvimento
springdoc.api-docs.enabled=${OPENAPI_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:false}