spring.application.name=fuelfinder

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fuelfinder}
spring.datasource.username=${DB_USER:fuelfinder}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

# OpenAPI / Swagger - habilitado em desenvolvimento
springdoc.api-docs.enabled=${OPENAPI_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:false}

# CORS - origens do frontend (lista separada por virgula)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# E-mail (SMTP) - padrao: Mailpit local (infra/compose.dev.yml)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Verificacao de e-mail
app.identity.verification-email.from=${MAIL_FROM:FuelFinder <no-reply@fuelfinder.local>}
app.identity.verification-email.link-base-url=${VERIFICATION_LINK_BASE_URL:http://localhost:3000/verificar-email}

# Processamento automatico da outbox de verificacao
app.identity.outbox.enabled=${OUTBOX_PROCESSING_ENABLED:true}
app.identity.outbox.poll-interval-ms=${OUTBOX_POLL_INTERVAL_MS:5000}
app.identity.outbox.max-events-per-run=${OUTBOX_MAX_EVENTS_PER_RUN:20}


# Autenticacao (JWT HS256). JWT_SECRET e obrigatorio: >= 32 bytes, nunca versionado.
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=${JWT_ISSUER:fuelfinder}
app.security.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT15M}
app.security.refresh-token-ttl=${JWT_REFRESH_TOKEN_TTL:P7D}

# SUPER_ADMIN inicial (opcional; criado so se ainda nao existir)
app.identity.super-admin.name=${SUPER_ADMIN_NAME:Super Admin}
app.identity.super-admin.email=${SUPER_ADMIN_EMAIL:}
app.identity.super-admin.password=${SUPER_ADMIN_PASSWORD:}
