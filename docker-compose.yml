name: fuelfinder

services:
  # ========================================
  # DATABASE — PostgreSQL + PostGIS
  # ========================================
  postgres:
    image: postgis/postgis:17-3.5
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME:-fuelfinder}
      POSTGRES_USER: ${DB_USER:-fuelfinder}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
      TZ: UTC

    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"

    volumes:
      - fuelfinder_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 12

    networks:
      - fuelfinder_network

  # ========================================
  # MAIL — Development SMTP
  # ========================================
  mailpit:
    image: axllent/mailpit:v1.27.10
    restart: unless-stopped

    ports:
      - "127.0.0.1:${MAIL_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

    networks:
      - fuelfinder_network

  # ========================================
  # BACKEND — Spring Boot / Java 21
  # ========================================
  backend:
    build:
      context: ./backend
      dockerfile: infra/Dockerfile

    restart: unless-stopped

    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-fuelfinder}
      DB_USER: ${DB_USER:-fuelfinder}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}

      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_SMTP_AUTH: "false"
      MAIL_SMTP_STARTTLS: "false"

      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env}
      JWT_ISSUER: ${JWT_ISSUER:-fuelfinder}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      VERIFICATION_LINK_BASE_URL: ${VERIFICATION_LINK_BASE_URL:-http://localhost:3000/verificar-email}

    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

    networks:
      - fuelfinder_network

  # ========================================
  # FRONTEND — Next.js 14 / React
  # ========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: infra/Dockerfile

    restart: unless-stopped
    init: true

    working_dir: /app

    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"

    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      BACKEND_URL: http://backend:8080
      WATCHPACK_POLLING: "true"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next

    depends_on:
      backend:
        condition: service_started

    networks:
      - fuelfinder_network

# ========================================
# PERSISTENT VOLUMES
# ========================================
volumes:
  fuelfinder_postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-fuelfinder_postgres_data}

  frontend_node_modules:
  frontend_next_cache:

# ========================================
# NETWORK
# ========================================
networks:
  fuelfinder_network:
    driver: bridge