name: FuelFinder Backend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
    contents: read
  
jobs:
    build-and-test:
      name: backend-ci
      runs-on: ubuntu-latest

      defaults:
        run:
          working-directory: backend
    
      steps:
        - name: Checkout repository
          uses: actions/checkout@v7

        - name: Setup Java 21
          uses: actions/setup-java@v6
          with:
            distribution: temurin
            java-version: '21'
            cache: maven
            cache-dependency-path: backend/pom.xml

        - name: Build and Test
          run: ./mvnw -B -ntp clean verify
