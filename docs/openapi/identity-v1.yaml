openapi: 3.1.0

info:
  title: FuelFinder Identity API
  version: 0.2.0
  description: >
    Local registration, email verification (with automatic
    verification email) and session authentication with
    JWT access tokens and single-use refresh tokens are
    implemented. Resend verification remains planned.

tags:
  - name: Authentication
    description: Registration, email verification and sessions
  - name: Users
    description: Authenticated user's account

paths:
  /api/v1/auth/register:
    post:
      tags: [Authentication]
      summary: Register a local user
      operationId: registerLocalUser
      description: >
        Creates a pending user, stores the password
        hash, and queues an email verification event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '202':
          description: >
            Registration persisted. Email verification
            will be processed asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/auth/verify-email:
    post:
      tags: [Authentication]
      summary: Verify an email address
      operationId: verifyEmail
      description: >
        Consumes a valid, unexpired verification token
        and activates the associated user account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '204':
          description: Email verified successfully
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Log in with email and password
      operationId: login
      description: >
        Opens a new session. Unknown email and wrong
        password return the same 401 response. The
        account status is revealed only after the
        correct password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session opened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >
            Email not verified (code EMAIL_NOT_VERIFIED)
            or account blocked (code ACCOUNT_BLOCKED)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      summary: Exchange a refresh token for a new token pair
      operationId: refreshSession
      description: >
        Refresh tokens are single use: the response carries
        a new one and the presented one stops working.
        Roles and account status are re-read on every refresh.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Tokens renewed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: End the session of a refresh token
      operationId: logout
      description: >
        Idempotent. Access tokens of the ended session
        stop working immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '204':
          description: Session ended (also for unknown tokens)
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/auth/logout-all:
    post:
      tags: [Authentication]
      summary: End every session of the authenticated user
      operationId: logoutAll
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Sessions ended
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/users/me:
    get:
      tags: [Users]
      summary: Get the authenticated user's profile
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/resend-verification:
    post:
      tags: [Authentication]
      summary: Request another verification email
      operationId: resendVerificationEmail
      description: >
        Planned endpoint. Returns the same accepted
        response whether or not an eligible account
        exists, reducing account enumeration risks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
      responses:
        '202':
          description: Request accepted for processing
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Access token from login or refresh, valid for
        15 minutes. Claims: sub (user id), roles, sid
        (session id), iss, iat, exp.

  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Maria Silva
        email:
          type: string
          format: email
          maxLength: 254
          example: maria@example.com
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          maxLength: 128
          description: >
            Plaintext password accepted only over HTTPS.
            It must never be logged or persisted directly.

    RegisterResponse:
      type: object
      additionalProperties: false
      required:
        - userId
        - status
      properties:
        userId:
          type: string
          format: uuid
        status:
          type: string
          const: PENDING_VERIFICATION

    VerifyEmailRequest:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 512
          writeOnly: true

    ResendVerificationRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
          maxLength: 254

    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          example: maria@example.com
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 512

    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          minLength: 1
          maxLength: 512
          writeOnly: true

    AuthTokensResponse:
      type: object
      additionalProperties: false
      required:
        - tokenType
        - accessToken
        - expiresIn
        - accessTokenExpiresAt
        - refreshToken
        - refreshTokenExpiresAt
      properties:
        tokenType:
          type: string
          const: Bearer
        accessToken:
          type: string
          description: "JWT sent as 'Authorization: Bearer <token>'"
        expiresIn:
          type: integer
          description: Seconds until the access token expires
          example: 900
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
          description: Opaque single-use token for /auth/refresh
        refreshTokenExpiresAt:
          type: string
          format: date-time

    UserProfileResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - email
        - roles
        - status
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Maria Silva
        email:
          type: string
          format: email
        roles:
          type: array
          items:
            type: string
            enum: [USER, STATION_MANAGER, ADMIN, SUPER_ADMIN]
        status:
          type: string
          enum: [ACTIVE]

    Problem:
      type: object
      description: RFC 9457-style problem details
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: >
            Stable error code for clients, e.g.
            INVALID_CREDENTIALS, EMAIL_NOT_VERIFIED,
            ACCOUNT_BLOCKED, INVALID_REFRESH_TOKEN,
            UNAUTHENTICATED, ACCESS_DENIED
      required:
        - title
        - status

  responses:
    BadRequest:
      description: Invalid request or verification token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    Unauthorized:
      description: >
        Missing, invalid or expired credentials or tokens
        (codes INVALID_CREDENTIALS, INVALID_REFRESH_TOKEN
        or UNAUTHENTICATED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    Conflict:
      description: Email is already registered
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    TooManyRequests:
      description: Request limit exceeded
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
